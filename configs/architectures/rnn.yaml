# =============================================================================
# RNN (Vanilla Recurrent Neural Network) - Architecture Configuration
# =============================================================================
# See configs/architectures/mlp.yaml for the full parameter format specification.
# =============================================================================

architecture_name: rnn


parameters:

  # hidden_size
  # -----------
  # Size of the hidden state vector.
  hidden_size:
    enabled: true
    initial_value: 128
    choices: [32, 64, 128, 256, 512, 1024]

  # num_layers
  # ----------
  # Number of stacked RNN layers. Vanilla RNN suffers from vanishing gradients
  # at high depth - limit to 3.
  num_layers:
    enabled: true
    initial_value: 1
    range: [1, 3]

  # embedding_dim
  # -------------
  # Embedding dimension for NLP tasks (ignored for numeric sequences).
  embedding_dim:
    enabled: true
    initial_value: 128
    choices: [64, 128, 256]


architectures:

  # bidirectional
  # -------------
  # If true, processes the sequence both forwards and backwards. Doubles the
  # output size but often significantly improves performance for NLP.
  bidirectional:
    enabled: true
    initial_value: false
    choices: [true, false]


methods:

  dropout:
    enabled: true
    initial_value: 0.1
    range: [0.0, 0.5]

  weight_decay:
    enabled: true
    initial_value: 1.0e-4
    range: [1.0e-6, 1.0e-3]
    log: true

  # gradient_clipping
  # -----------------
  # Essential for RNNs - they are prone to exploding gradients.
  gradient_clipping:
    enabled: true
    initial_value: 1.0
    range: [0.5, 5.0]

  early_stopping:
    enabled: true
    initial_value: true
    choices: [true, false]
    patience: 8


optimization:

  optimizer_name:
    enabled: true
    initial_value: "adam"
    choices: ["adam", "adamw", "rmsprop"]

  learning_rate:
    enabled: true
    initial_value: 1.0e-3
    range: [1.0e-4, 1.0e-2]
    log: true

  lr_scheduler:
    enabled: true
    initial_value: "none"
    choices: ["none", "cosine", "reduce_on_plateau"]


training:

  batch_size:
    enabled: true
    initial_value: 64
    choices: [32, 64, 128]

  epochs:
    enabled: true
    initial_value: 40

  validation_split:
    enabled: true
    initial_value: 0.2

  # sequence_length
  # ---------------
  # Fixed sequence length (sequences are truncated or padded).
  sequence_length:
    enabled: true
    initial_value: 128

  # loss_function - see configs/architectures/mlp.yaml for full docs
  loss_function:
    enabled: true
    initial_value: "auto"
    choices: ["auto", "cross_entropy", "focal", "mse"]

  # focal_gamma - see mlp.yaml. Used only when loss_function=focal.
  focal_gamma:
    enabled: true
    initial_value: 2.0
    range: [0.5, 5.0]

  # num_workers - see mlp.yaml.
  num_workers:
    enabled: true
    initial_value: 2
    range: [0, 8]

  # text_augmentation
  # -----------------
  # Augmentation strategy for sequence/text data (training set only):
  #   none         : no augmentation
  #   token_dropout: randomly mask tokens with prob `text_augmentation_prob`
  #                  Acts as word-level dropout. Strongest regularizer.
  #   word_shuffle : shuffle tokens within tiny windows of size 3.
  #                  Mild perturbation; preserves locality.
  #   ngram_shuffle: shuffle n-grams (size 2-3) across the sequence.
  #                  Stronger structural perturbation; breaks long-range order.
  text_augmentation:
    enabled: true
    initial_value: "none"
    choices: ["none", "token_dropout", "word_shuffle", "ngram_shuffle"]

  # text_augmentation_prob
  # ----------------------
  # Probability for token-level mask/shuffle when text_augmentation is active.
  text_augmentation_prob:
    enabled: true
    initial_value: 0.1
    range: [0.0, 0.3]


  # gradient_accumulation_steps
  # ---------------------------
  # Accumulate gradients over N batches before stepping the optimizer.
  # Effective batch size = batch_size * gradient_accumulation_steps.
  # Use this to simulate large batches when GPU memory is limited.
  #   1 = no accumulation (default, single step per batch).
  #   2-8 = accumulate; useful when you want batch_size=256 but only RAM for 32.
  gradient_accumulation_steps:
    enabled: true
    initial_value: 1
    range: [1, 8]

  # mixed_precision
  # ---------------
  # Use fp16 (half precision) on GPU to roughly double training speed and
  # halve VRAM usage. Has no effect on CPU.
  #   true  : enables torch.cuda.amp autocast + GradScaler.
  #   false : standard fp32 training (default - safest).
  mixed_precision:
    enabled: true
    initial_value: false
    choices: [true, false]

  # embedding_dropout
  # -----------------
  # Dropout applied to the embedding layer output before feeding it to the RNN/Transformer.
  # Different from `dropout` (which acts inside the recurrent layers).
  # Useful regularization technique specific to NLP architectures.
  #   0.0  : no embedding dropout (default).
  #   0.1-0.3: typical range; helps prevent the embedding lookup from overfitting.
  embedding_dropout:
    enabled: true
    initial_value: 0.0
    range: [0.0, 0.4]


# =============================================================================
# Advanced optimizer parameters (disabled by default - for expert tuning)
# =============================================================================

  # adam_beta1
  # ----------
  # First moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.9 is optimal for ~99% of tasks. Lower (0.85) sometimes
  # helps very large batch training. Enable only if you know what you're doing.
  adam_beta1:
    enabled: false
    initial_value: 0.9
    range: [0.85, 0.95]

  # adam_beta2
  # ----------
  # Second moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.999 is optimal for ~99% of tasks. Some recipes (GPT-style)
  # use 0.95 for very large models. Enable only if you know what you're doing.
  adam_beta2:
    enabled: false
    initial_value: 0.999
    range: [0.9, 0.9999]
