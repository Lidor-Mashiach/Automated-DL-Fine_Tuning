# =============================================================================
# MLP (Multi-Layer Perceptron) - Architecture Configuration
# =============================================================================
#
# Parameter configuration format:
#   enabled:        true/false. If false, the parameter is never used.
#   initial_value:  starting value for the root trial. null = system picks.
#   range:          [min, max] - hard boundary for continuous parameters.
#                   The Analyzer will never propose values outside this range.
#   choices:        [a, b, c] - discrete options (mutually exclusive with range).
#   log:            true for parameters spanning orders of magnitude
#                   (e.g., learning_rate). Enables log-scale sampling.
#
# See configs/architectures/README.md for full documentation.
# =============================================================================

architecture_name: mlp


# =============================================================================
# 1) parameters - core architecture parameters
# =============================================================================
# Scalar parameters that define the width, depth, and activation of the network.
# =============================================================================
parameters:

  # num_hidden_layers
  # -----------------
  # Number of hidden layers (depth). Too few -> underfit. Too many -> overfit
  # on small datasets, training instability on deeper ranges.
  # Typical: 1-5 for most tasks.
  num_hidden_layers:
    enabled: true
    initial_value: 2
    range: [1, 5]

  # hidden_size
  # -----------
  # Width of the primary hidden layer. Interacts with num_hidden_layers: going
  # wider vs deeper changes what patterns the network can learn.
  hidden_size:
    enabled: true
    initial_value: 128
    choices: [32, 64, 128, 256, 512, 1024]

  # activation
  # ----------
  # Non-linear activation function. Different activations suit different tasks:
  #   relu       : Classic, fast. Risk of "dying ReLU" in deep nets.
  #   gelu       : Smoother than ReLU. Standard in transformers.
  #   leaky_relu : Fixes dying ReLU. Good for deep networks.
  #   tanh       : Output range [-1, 1]. Less common today, useful for RNNs.
  activation:
    enabled: true
    initial_value: "relu"
    choices: ["relu", "gelu", "leaky_relu", "tanh"]


# =============================================================================
# 2) architectures - structural variants
# =============================================================================
# Choices that change the overall shape of the network.
# =============================================================================
architectures:

  # layer_shape
  # -----------
  # How the width of hidden layers changes from input to output:
  #   uniform    : all layers same width (128-128-128)
  #   funnel     : width halves each layer (128-64-32)
  #   pyramid    : width grows each layer (32-64-128)
  #   hourglass  : grows toward middle then shrinks (64-128-64)
  #   bottleneck : shrinks toward middle then grows (128-64-128) - autoencoder-like
  layer_shape:
    enabled: true
    initial_value: "uniform"
    choices: ["uniform", "funnel", "pyramid", "hourglass", "bottleneck"]


# =============================================================================
# 3) methods - regularization and training-stability methods
# =============================================================================
# Each method can be turned on/off independently. When enabled, the Analyzer
# decides when to apply or adjust it during the search. When disabled, it is
# never used in any trial.
# =============================================================================
methods:

  # dropout
  # -------
  # Randomly drops a fraction of neurons during training to prevent overfitting.
  # Range: 0.0 (off) to 0.5. Higher -> stronger regularization.
  dropout:
    enabled: true
    initial_value: 0.1
    range: [0.0, 0.5]

  # batch_norm
  # ----------
  # Normalizes activations across the batch for training stability. Usually
  # beneficial, but can hurt with tiny batch sizes (<8).
  batch_norm:
    enabled: true
    initial_value: true
    choices: [true, false]

  # weight_decay (L2 regularization)
  # --------------------------------
  # Penalizes large weights to prevent overfitting. Log-scaled because values
  # span orders of magnitude. Higher -> stronger regularization.
  weight_decay:
    enabled: true
    initial_value: 1.0e-4
    range: [1.0e-6, 1.0e-2]
    log: true

  # gradient_clipping
  # -----------------
  # Clips gradient norm to prevent exploding gradients. Typical value: 1.0.
  # Set to 0 to disable.
  gradient_clipping:
    enabled: true
    initial_value: 1.0
    range: [0.0, 10.0]

  # early_stopping (trial-level)
  # ----------------------------
  # Stops a SINGLE trial's training when smoothed val_loss hasn't improved
  # for `patience` epochs. Not related to run-level convergence_patience.
  # This uses the smoothed curve to avoid stopping on temporary spikes.
  early_stopping:
    enabled: true
    initial_value: true
    choices: [true, false]
    patience: 10

  # label_smoothing
  # ---------------
  # Softens classification targets (e.g. [0, 1, 0] -> [0.03, 0.94, 0.03]).
  # Reduces overconfidence and often improves generalization.
  # Disabled (0.0) by default - Analyzer enables if overfit detected.
  label_smoothing:
    enabled: true
    initial_value: 0.0
    range: [0.0, 0.2]


# =============================================================================
# 4) optimization - optimizer, learning rate, scheduler
# =============================================================================
optimization:

  # name (optimizer)
  # ----------------
  # Which optimization algorithm:
  #   adam    : Most popular, works well on most tasks. Good default.
  #   adamw   : Adam with correct weight decay handling. Best for deep nets.
  #   sgd     : With momentum, competes with Adam on final accuracy. Slower.
  #   rmsprop : Good for RNNs. Sometimes gives more stable training.
  optimizer_name:
    enabled: true
    initial_value: "adam"
    choices: ["adam", "adamw", "sgd", "rmsprop"]

  # learning_rate
  # -------------
  # Step size for weight updates. The most sensitive parameter in the system.
  # Log-scaled because it spans 4+ orders of magnitude.
  # Too high -> divergence / local minima. Too low -> slow or no learning.
  learning_rate:
    enabled: true
    initial_value: 1.0e-3
    range: [1.0e-5, 1.0e-1]
    log: true

  # momentum
  # --------
  # Accumulates previous gradients to smooth updates. Only used by SGD/RMSprop.
  # Adam derivatives compute their own momentum internally.
  momentum:
    enabled: true
    initial_value: 0.9
    range: [0.5, 0.99]

  # lr_scheduler
  # ------------
  # Decays learning rate during training. Options:
  #   none               : constant LR throughout
  #   cosine             : smooth decay to near-zero by end
  #   step               : piecewise reduction every N epochs
  #   reduce_on_plateau  : reduces LR when val_loss stops improving
  lr_scheduler:
    enabled: true
    initial_value: "none"
    choices: ["none", "cosine", "step", "reduce_on_plateau"]


# =============================================================================
# 5) training - training loop settings
# =============================================================================
training:

  # batch_size
  # ----------
  # Number of samples per gradient update. Larger -> faster, less noise.
  # Smaller -> more updates per epoch, can escape local minima.
  batch_size:
    enabled: true
    initial_value: 64
    choices: [32, 64, 128, 256]

  # epochs
  # ------
  # Maximum epochs per trial. early_stopping usually ends earlier.
  # Fixed (not tuned) so trials remain comparable.
  epochs:
    enabled: true
    initial_value: 50

  # validation_split
  # ----------------
  # Fraction of the Train_set used for in-trial validation (during training,
  # for early_stopping). Unrelated to the Train/Val/Test split in main.py.
  validation_split:
    enabled: true
    initial_value: 0.2

  # loss_function
  # -------------
  # Which loss function to optimize during training.
  #   auto          : pick automatically based on TASK_TYPE and class balance:
  #                     classification + balanced  -> cross_entropy
  #                     classification + ratio>3:1 -> focal (gamma=1.5)
  #                     classification + ratio>10:1-> focal (gamma=2.5)
  #                     regression                 -> mse
  #   cross_entropy : standard for classification, balanced classes.
  #   focal         : classification with class imbalance; uses focal_gamma below.
  #   mse           : regression only.
  loss_function:
    enabled: true
    initial_value: "auto"
    choices: ["auto", "cross_entropy", "focal", "mse"]

  # focal_gamma
  # -----------
  # Focusing strength for Focal Loss. Only used when loss_function = "focal".
  # 0 = no focusing (acts like cross_entropy).
  # 1 = mild focus on hard examples.
  # 2 = recommended starting point (paper default for moderate imbalance).
  # 5 = aggressive; can hurt training.
  # When loss_function = "auto", gamma is set automatically based on imbalance ratio.
  focal_gamma:
    enabled: true
    initial_value: 2.0
    range: [0.5, 5.0]

  # normalization
  # -------------
  # How tabular features are scaled before training. (Tabular data only.)
  #   none        : no scaling. Use only if data is already preprocessed.
  #   standardize : (x - mean) / std per column. Default. Best for symmetric data.
  #   min_max     : (x - min) / (max - min) per column. Maps to [0, 1].
  #                 Good for bounded features (percentages, scores).
  #                 Sensitive to outliers.
  #   max_abs     : x / max(|x|) per column. Maps to [-1, 1]. Preserves zeros.
  #                 Good for sparse data.
  # NOTE: normalization is a data-preprocessing decision applied once at
  # load time (in data_loaders/local_loader.py), NOT a per-trial hyperparameter.
  # Changing it per trial would require reloading + re-normalizing the entire
  # dataset, which is expensive and circular. The Analyzer's `change_normalization`
  # action exists but is gated by enabled=false here, so FTTS won't actually
  # mutate it. To use a non-default method, set it in the data loader directly.
  normalization:
    enabled: false
    initial_value: "standardize"
    choices: ["none", "standardize", "min_max", "max_abs"]

  # num_workers
  # -----------
  # SYSTEM/HARDWARE setting (the Analyzer never touches this).
  # Number of subprocess workers loading batches in parallel.
  #   0     : single process (default, safest, recommended for tabular data)
  #   2-4   : good for image / text datasets
  #   8+    : only for very large datasets with many CPU cores
  # Each worker uses additional RAM. On Windows, workers are slower due
  # to process-creation overhead. See README.md for RAM estimates.
  num_workers:
    enabled: true
    initial_value: 0
    range: [0, 8]


  # gradient_accumulation_steps
  # ---------------------------
  # Accumulate gradients over N batches before stepping the optimizer.
  # Effective batch size = batch_size * gradient_accumulation_steps.
  # Use this to simulate large batches when GPU memory is limited.
  #   1 = no accumulation (default, single step per batch).
  #   2-8 = accumulate; useful when you want batch_size=256 but only RAM for 32.
  gradient_accumulation_steps:
    enabled: true
    initial_value: 1
    range: [1, 8]

  # mixed_precision
  # ---------------
  # Use fp16 (half precision) on GPU to roughly double training speed and
  # halve VRAM usage. Has no effect on CPU.
  #   true  : enables torch.cuda.amp autocast + GradScaler.
  #   false : standard fp32 training (default - safest).
  mixed_precision:
    enabled: true
    initial_value: false
    choices: [true, false]


# =============================================================================
# Advanced optimizer parameters (disabled by default - for expert tuning)
# =============================================================================

  # adam_beta1
  # ----------
  # First moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.9 is optimal for ~99% of tasks. Lower (0.85) sometimes
  # helps very large batch training. Enable only if you know what you're doing.
  adam_beta1:
    enabled: false
    initial_value: 0.9
    range: [0.85, 0.95]

  # adam_beta2
  # ----------
  # Second moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.999 is optimal for ~99% of tasks. Some recipes (GPT-style)
  # use 0.95 for very large models. Enable only if you know what you're doing.
  adam_beta2:
    enabled: false
    initial_value: 0.999
    range: [0.9, 0.9999]
