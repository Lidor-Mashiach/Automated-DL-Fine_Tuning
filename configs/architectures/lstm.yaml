# =============================================================================
# LSTM (Long Short-Term Memory) - Architecture Configuration
# =============================================================================

architecture_name: lstm


parameters:

  # hidden_size
  # -----------
  # Size of the LSTM hidden state. Wider than vanilla RNN can typically afford.
  hidden_size:
    enabled: true
    initial_value: 256
    choices: [32, 64, 128, 256, 512, 1024]

  # num_layers
  # ----------
  # Number of stacked LSTM layers. LSTM handles depth better than vanilla RNN.
  num_layers:
    enabled: true
    initial_value: 2
    range: [1, 4]

  embedding_dim:
    enabled: true
    initial_value: 128
    choices: [64, 128, 256]


architectures:

  # bidirectional
  # -------------
  # Bidirectional LSTM reads sequences forward AND backward. Useful for
  # classification, but INCOMPATIBLE WITH GENERATION (the model would peek
  # at future tokens). For language_modeling, MUST be false.
  # The analyzer can suggest `disable_bidirectional` if generation is the goal.
  bidirectional:
    enabled: true
    initial_value: false
    choices: [true, false]


methods:

  dropout:
    enabled: true
    initial_value: 0.2
    range: [0.0, 0.5]

  weight_decay:
    enabled: true
    initial_value: 1.0e-4
    range: [1.0e-6, 1.0e-3]
    log: true

  gradient_clipping:
    enabled: true
    initial_value: 1.0
    range: [0.5, 5.0]

  early_stopping:
    enabled: true
    initial_value: true
    choices: [true, false]
    patience: 8


optimization:

  optimizer_name:
    enabled: true
    initial_value: "adam"
    choices: ["adam", "adamw"]

  learning_rate:
    enabled: true
    initial_value: 1.0e-3
    range: [1.0e-4, 1.0e-2]
    log: true

  lr_scheduler:
    enabled: true
    initial_value: "cosine"
    choices: ["none", "cosine", "reduce_on_plateau"]


training:

  batch_size:
    enabled: true
    initial_value: 64
    choices: [32, 64, 128, 256]

  epochs:
    enabled: true
    initial_value: 50

  validation_split:
    enabled: true
    initial_value: 0.2

  # sequence_length
  # ---------------
  # Length of token windows fed to the LSTM. Critical for language_modeling:
  # longer = more context, but harder gradient flow.
  # The analyzer can suggest increase_sequence_length / decrease_sequence_length.
  sequence_length:
    enabled: true
    initial_value: 128
    choices: [32, 64, 128, 256, 512, 1024]

  # loss_function - see configs/architectures/mlp.yaml for full docs
  loss_function:
    enabled: true
    initial_value: "auto"
    choices: ["auto", "cross_entropy", "focal", "mse"]

  # focal_gamma - see mlp.yaml. Used only when loss_function=focal.
  focal_gamma:
    enabled: true
    initial_value: 2.0
    range: [0.5, 5.0]

  # num_workers - see mlp.yaml.
  num_workers:
    enabled: true
    initial_value: 2
    range: [0, 8]

  # text_augmentation - see rnn.yaml for full docs.
  text_augmentation:
    enabled: true
    initial_value: "none"
    choices: ["none", "token_dropout", "word_shuffle", "ngram_shuffle"]

  # text_augmentation_prob - see rnn.yaml.
  text_augmentation_prob:
    enabled: true
    initial_value: 0.1
    range: [0.0, 0.3]


  # gradient_accumulation_steps
  # ---------------------------
  # Accumulate gradients over N batches before stepping the optimizer.
  # Effective batch size = batch_size * gradient_accumulation_steps.
  # Use this to simulate large batches when GPU memory is limited.
  #   1 = no accumulation (default, single step per batch).
  #   2-8 = accumulate; useful when you want batch_size=256 but only RAM for 32.
  gradient_accumulation_steps:
    enabled: true
    initial_value: 1
    range: [1, 8]

  # mixed_precision
  # ---------------
  # Use fp16 (half precision) on GPU to roughly double training speed and
  # halve VRAM usage. Has no effect on CPU.
  #   true  : enables torch.cuda.amp autocast + GradScaler.
  #   false : standard fp32 training (default - safest).
  mixed_precision:
    enabled: true
    initial_value: false
    choices: [true, false]

  # embedding_dropout
  # -----------------
  # Dropout applied to the embedding layer output before feeding it to the RNN/Transformer.
  # Different from `dropout` (which acts inside the recurrent layers).
  # Useful regularization technique specific to NLP architectures.
  #   0.0  : no embedding dropout (default).
  #   0.1-0.3: typical range; helps prevent the embedding lookup from overfitting.
  embedding_dropout:
    enabled: true
    initial_value: 0.0
    range: [0.0, 0.4]


# =============================================================================
# Advanced optimizer parameters (disabled by default - for expert tuning)
# =============================================================================

  # adam_beta1
  # ----------
  # First moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.9 is optimal for ~99% of tasks. Lower (0.85) sometimes
  # helps very large batch training. Enable only if you know what you're doing.
  adam_beta1:
    enabled: false
    initial_value: 0.9
    range: [0.85, 0.95]

  # adam_beta2
  # ----------
  # Second moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.999 is optimal for ~99% of tasks. Some recipes (GPT-style)
  # use 0.95 for very large models. Enable only if you know what you're doing.
  adam_beta2:
    enabled: false
    initial_value: 0.999
    range: [0.9, 0.9999]


# =============================================================================
# Language modeling parameters (used only when task_type == "language_modeling")
# =============================================================================

  # fusion_method
  # -------------
  # How Word2Vec embeddings and MIDI features are combined per timestep.
  #   concatenate : direct concatenation - simple, no learned mapping.
  #   project     : each side passes through a Linear+ReLU first, then concat.
  #                 Allows the model to balance the contribution of each modality.
  fusion_method:
    enabled: true
    initial_value: "concatenate"
    choices: ["concatenate", "project"]

  # fusion_proj_dim
  # ---------------
  # Width of the projection layers (only used when fusion_method == "project").
  fusion_proj_dim:
    enabled: true
    initial_value: 128
    choices: [64, 128, 256, 512]

  # freeze_embeddings
  # -----------------
  # If true (default), Word2Vec embeddings are loaded but not updated during
  # training. If false, they are fine-tuned (slower, may overfit).
  freeze_embeddings:
    enabled: true
    initial_value: true
    choices: [true, false]

  # tie_weights
  # -----------
  # Tie output projection weights with embedding weights (requires
  # hidden_size == embedding_dim). Reduces parameters and often improves LM
  # generalization, but constrains the architecture.
  tie_weights:
    enabled: false
    initial_value: false
    choices: [true, false]


# =============================================================================
# Language modeling - decoding & sequence behavior
# =============================================================================

  # teacher_forcing_ratio
  # ---------------------
  # Probability (per training step) of feeding the GROUND-TRUTH previous word
  # instead of the model's own prediction. Used only during training.
  #   1.0 = always ground truth (classic LM training - fastest convergence)
  #   0.5 = mixed (model learns to recover from its own errors)
  #   0.0 = always model output (scheduled sampling - matches inference)
  # Lower values trade convergence speed for generation robustness.
  teacher_forcing_ratio:
    enabled: true
    initial_value: 1.0
    choices: [0.3, 0.5, 0.7, 1.0]

  # max_words_per_line
  # ------------------
  # Soft upper bound: training adds a small loss penalty when the model
  # produces more than this many tokens between two line-separator tokens.
  # Encourages the model to break lines at musically reasonable points.
  # Set to a high value (e.g. 100) to effectively disable.
  max_words_per_line:
    enabled: true
    initial_value: 12
    choices: [8, 10, 12, 16, 100]

  # min_words_per_line
  # ------------------
  # Soft lower bound: training adds a small loss penalty when the model
  # produces a line shorter than this. Set to 0 to disable.
  min_words_per_line:
    enabled: true
    initial_value: 2
    choices: [0, 2, 3]
