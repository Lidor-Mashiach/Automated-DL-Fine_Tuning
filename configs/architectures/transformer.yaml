# =============================================================================
# Transformer Encoder - Architecture Configuration
# =============================================================================

architecture_name: transformer


parameters:

  # d_model
  # -------
  # Embedding dimension throughout the model. Must be divisible by nhead.
  # The system auto-fixes mismatched pairs.
  d_model:
    enabled: true
    initial_value: 128
    choices: [64, 128, 256, 512, 1024]

  # nhead
  # -----
  # Number of attention heads. Each head attends to a different subspace.
  nhead:
    enabled: true
    initial_value: 4
    choices: [2, 4, 8]

  # num_encoder_layers
  # ------------------
  # Depth of the encoder stack. More layers = more capacity, slower training.
  num_encoder_layers:
    enabled: true
    initial_value: 3
    range: [2, 6]

  # dim_feedforward
  # ---------------
  # Hidden dimension of the feed-forward subnetwork within each encoder layer.
  # Typically 2-4x d_model.
  dim_feedforward:
    enabled: true
    initial_value: 512
    choices: [256, 512, 1024, 2048]

  activation:
    enabled: true
    initial_value: "gelu"
    choices: ["relu", "gelu"]

  # embedding_dim
  # -------------
  # In this Transformer implementation, the embedding dimension is forced to
  # equal `d_model` (a standard convention; required for residual connections
  # to work with the encoder layer outputs). This parameter is kept for YAML
  # consistency but disabled - changing it has no effect.
  embedding_dim:
    enabled: false
    initial_value: 128
    choices: [64, 128, 256]


architectures:

  # positional_encoding
  # -------------------
  # Positional information added to token embeddings:
  #   sinusoidal : fixed sinusoids (no parameters to learn)
  # Currently only sinusoidal is implemented. Disabled because there's only
  # one option; kept here for future extensibility (learned/relative).
  positional_encoding:
    enabled: false
    initial_value: "sinusoidal"
    choices: ["sinusoidal"]


methods:

  # dropout
  # -------
  # Applied after attention and feed-forward sublayers.
  dropout:
    enabled: true
    initial_value: 0.1
    range: [0.0, 0.3]

  # attention_dropout
  # -----------------
  # Dropout applied inside the attention mechanism.
  attention_dropout:
    enabled: true
    initial_value: 0.1
    range: [0.0, 0.3]

  weight_decay:
    enabled: true
    initial_value: 1.0e-4
    range: [1.0e-5, 1.0e-2]
    log: true

  gradient_clipping:
    enabled: true
    initial_value: 1.0
    range: [0.0, 5.0]

  # lr_warmup
  # ---------
  # Warmup steps over which LR rises from 0 to the target value. Essential
  # for transformer stability in early training.
  lr_warmup:
    enabled: true
    initial_value: 500
    range: [100, 2000]

  # label_smoothing
  # ---------------
  label_smoothing:
    enabled: true
    initial_value: 0.1
    range: [0.0, 0.2]

  early_stopping:
    enabled: true
    initial_value: true
    choices: [true, false]
    patience: 8


optimization:

  optimizer_name:
    enabled: true
    initial_value: "adamw"
    choices: ["adam", "adamw"]

  # learning_rate
  # -------------
  # Narrower range than other architectures - transformers are LR-sensitive.
  learning_rate:
    enabled: true
    initial_value: 1.0e-4
    range: [1.0e-5, 1.0e-3]
    log: true

  lr_scheduler:
    enabled: true
    initial_value: "cosine"
    choices: ["cosine", "reduce_on_plateau"]


training:

  batch_size:
    enabled: true
    initial_value: 32
    choices: [16, 32, 64]

  epochs:
    enabled: true
    initial_value: 40

  validation_split:
    enabled: true
    initial_value: 0.2

  sequence_length:
    enabled: true
    initial_value: 128

  # loss_function - see configs/architectures/mlp.yaml for full docs
  loss_function:
    enabled: true
    initial_value: "auto"
    choices: ["auto", "cross_entropy", "focal", "mse"]

  # focal_gamma - see mlp.yaml. Used only when loss_function=focal.
  focal_gamma:
    enabled: true
    initial_value: 2.0
    range: [0.5, 5.0]

  # num_workers - see mlp.yaml.
  num_workers:
    enabled: true
    initial_value: 2
    range: [0, 8]

  # text_augmentation - see rnn.yaml for full docs.
  text_augmentation:
    enabled: true
    initial_value: "none"
    choices: ["none", "token_dropout", "word_shuffle", "ngram_shuffle"]

  # text_augmentation_prob - see rnn.yaml.
  text_augmentation_prob:
    enabled: true
    initial_value: 0.1
    range: [0.0, 0.3]


  # gradient_accumulation_steps
  # ---------------------------
  # Accumulate gradients over N batches before stepping the optimizer.
  # Effective batch size = batch_size * gradient_accumulation_steps.
  # Use this to simulate large batches when GPU memory is limited.
  #   1 = no accumulation (default, single step per batch).
  #   2-8 = accumulate; useful when you want batch_size=256 but only RAM for 32.
  gradient_accumulation_steps:
    enabled: true
    initial_value: 1
    range: [1, 8]

  # mixed_precision
  # ---------------
  # Use fp16 (half precision) on GPU to roughly double training speed and
  # halve VRAM usage. Has no effect on CPU.
  #   true  : enables torch.cuda.amp autocast + GradScaler.
  #   false : standard fp32 training (default - safest).
  mixed_precision:
    enabled: true
    initial_value: false
    choices: [true, false]

  # embedding_dropout
  # -----------------
  # Dropout applied to the embedding layer output before feeding it to the RNN/Transformer.
  # Different from `dropout` (which acts inside the recurrent layers).
  # Useful regularization technique specific to NLP architectures.
  #   0.0  : no embedding dropout (default).
  #   0.1-0.3: typical range; helps prevent the embedding lookup from overfitting.
  embedding_dropout:
    enabled: true
    initial_value: 0.0
    range: [0.0, 0.4]


# =============================================================================
# Advanced optimizer parameters (disabled by default - for expert tuning)
# =============================================================================

  # adam_beta1
  # ----------
  # First moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.9 is optimal for ~99% of tasks. Lower (0.85) sometimes
  # helps very large batch training. Enable only if you know what you're doing.
  adam_beta1:
    enabled: false
    initial_value: 0.9
    range: [0.85, 0.95]

  # adam_beta2
  # ----------
  # Second moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.999 is optimal for ~99% of tasks. Some recipes (GPT-style)
  # use 0.95 for very large models. Enable only if you know what you're doing.
  adam_beta2:
    enabled: false
    initial_value: 0.999
    range: [0.9, 0.9999]


# =============================================================================
# Deep-only regularization
# =============================================================================

  # stochastic_depth
  # ----------------
  # Drops entire encoder layers randomly during training (replaces them with
  # an identity skip). Useful regularizer for DEEP transformers (>= 4 layers).
  # When num_encoder_layers < 4, this parameter has no effective impact even
  # if enabled.
  #   0.0  : disabled (default)
  #   0.1  : drop ~10% of layers per forward pass (mild)
  #   0.2  : moderate; helps ViT-Large, BERT-Large
  #   0.3+ : aggressive; only for very deep nets (12+ layers)
  stochastic_depth:
    enabled: true
    initial_value: 0.0
    range: [0.0, 0.3]
