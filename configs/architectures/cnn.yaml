# =============================================================================
# CNN (Convolutional Neural Network) - Architecture Configuration
# =============================================================================
# See configs/architectures/mlp.yaml for the full parameter format specification
# and configs/architectures/README.md for documentation.
# =============================================================================

architecture_name: cnn


# =============================================================================
# 1) parameters
# =============================================================================
parameters:

  # num_conv_blocks
  # ---------------
  # Number of Conv-Activation-Pool blocks. Each block halves the spatial size.
  num_conv_blocks:
    enabled: true
    initial_value: 3
    range: [2, 5]

  # base_filters
  # ------------
  # Number of filters in the first conv block. Doubles each block (VGG-style).
  base_filters:
    enabled: true
    initial_value: 32
    choices: [16, 32, 64, 128]

  # kernel_size
  # -----------
  # Size of convolutional kernel (square). 3x3 is standard; 5x5 for larger images.
  kernel_size:
    enabled: true
    initial_value: 3
    choices: [3, 5]

  # num_fc_layers
  # -------------
  # Number of fully-connected layers after the convolutional stack.
  num_fc_layers:
    enabled: true
    initial_value: 1
    range: [1, 3]

  # fc_size
  # -------
  # Width of the first FC layer. Halves each subsequent FC layer.
  fc_size:
    enabled: true
    initial_value: 256
    choices: [128, 256, 512, 1024]

  # activation
  # ----------
  # Non-linear activation. See mlp.yaml for descriptions.
  activation:
    enabled: true
    initial_value: "relu"
    choices: ["relu", "gelu", "leaky_relu"]


# =============================================================================
# 2) architectures
# =============================================================================
architectures:

  # pooling
  # -------
  # Pooling method between conv blocks:
  #   max : emphasizes strong features (standard)
  #   avg : smooths features (sometimes better for small datasets)
  pooling:
    enabled: true
    initial_value: "max"
    choices: ["max", "avg"]


# =============================================================================
# 3) methods
# =============================================================================
methods:

  # dropout
  # -------
  # Applied in the FC head. Lower than MLP since conv layers already regularize.
  dropout:
    enabled: true
    initial_value: 0.1
    range: [0.0, 0.5]

  # batch_norm
  # ----------
  # Nearly essential for CNNs - stabilizes training significantly.
  batch_norm:
    enabled: true
    initial_value: true
    choices: [true, false]

  # weight_decay
  # ------------
  weight_decay:
    enabled: true
    initial_value: 1.0e-4
    range: [1.0e-6, 1.0e-3]
    log: true

  # gradient_clipping
  # -----------------
  gradient_clipping:
    enabled: true
    initial_value: 1.0
    range: [0.0, 10.0]

  # data_augmentation
  # -----------------
  # Data augmentation strength for training:
  #   none   : no augmentation (raw data only)
  #   light  : horizontal flip + random crop
  #   medium : + color jitter + rotation
  data_augmentation:
    enabled: true
    initial_value: "light"
    choices: ["none", "light", "medium"]

  # mixup
  # -----
  # Blends pairs of training samples. Strong regularizer for small datasets.
  # 0.0 = disabled. Typical effective values: 0.1-0.4.
  mixup:
    enabled: true
    initial_value: 0.0
    range: [0.0, 0.4]

  # label_smoothing
  # ---------------
  label_smoothing:
    enabled: true
    initial_value: 0.0
    range: [0.0, 0.2]

  # early_stopping
  # --------------
  early_stopping:
    enabled: true
    initial_value: true
    choices: [true, false]
    patience: 10


# =============================================================================
# 4) optimization
# =============================================================================
optimization:

  optimizer_name:
    enabled: true
    initial_value: "adamw"
    choices: ["adam", "adamw", "sgd"]

  learning_rate:
    enabled: true
    initial_value: 1.0e-3
    range: [1.0e-4, 1.0e-2]
    log: true

  momentum:
    enabled: true
    initial_value: 0.9
    range: [0.8, 0.99]

  lr_scheduler:
    enabled: true
    initial_value: "cosine"
    choices: ["none", "cosine", "step", "reduce_on_plateau"]


# =============================================================================
# 5) training
# =============================================================================
training:

  batch_size:
    enabled: true
    initial_value: 64
    choices: [32, 64, 128]

  epochs:
    enabled: true
    initial_value: 50

  validation_split:
    enabled: true
    initial_value: 0.2

  # image_size
  # ----------
  # Target image dimension (images are resized to image_size x image_size).
  # Larger -> slower but potentially more accurate.
  image_size:
    enabled: true
    initial_value: 64

  # loss_function - see configs/architectures/mlp.yaml for full docs
  loss_function:
    enabled: true
    initial_value: "auto"
    choices: ["auto", "cross_entropy", "focal", "mse"]

  # focal_gamma - see mlp.yaml. Used only when loss_function=focal.
  focal_gamma:
    enabled: true
    initial_value: 2.0
    range: [0.5, 5.0]

  # num_workers - see mlp.yaml. Higher recommended for image data.
  num_workers:
    enabled: true
    initial_value: 2
    range: [0, 8]


  # gradient_accumulation_steps
  # ---------------------------
  # Accumulate gradients over N batches before stepping the optimizer.
  # Effective batch size = batch_size * gradient_accumulation_steps.
  # Use this to simulate large batches when GPU memory is limited.
  #   1 = no accumulation (default, single step per batch).
  #   2-8 = accumulate; useful when you want batch_size=256 but only RAM for 32.
  gradient_accumulation_steps:
    enabled: true
    initial_value: 1
    range: [1, 8]

  # mixed_precision
  # ---------------
  # Use fp16 (half precision) on GPU to roughly double training speed and
  # halve VRAM usage. Has no effect on CPU.
  #   true  : enables torch.cuda.amp autocast + GradScaler.
  #   false : standard fp32 training (default - safest).
  mixed_precision:
    enabled: true
    initial_value: false
    choices: [true, false]


# =============================================================================
# Advanced optimizer parameters (disabled by default - for expert tuning)
# =============================================================================

  # adam_beta1
  # ----------
  # First moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.9 is optimal for ~99% of tasks. Lower (0.85) sometimes
  # helps very large batch training. Enable only if you know what you're doing.
  adam_beta1:
    enabled: false
    initial_value: 0.9
    range: [0.85, 0.95]

  # adam_beta2
  # ----------
  # Second moment decay rate for Adam/AdamW. Disabled by default.
  # Standard value 0.999 is optimal for ~99% of tasks. Some recipes (GPT-style)
  # use 0.95 for very large models. Enable only if you know what you're doing.
  adam_beta2:
    enabled: false
    initial_value: 0.999
    range: [0.9, 0.9999]


# =============================================================================
# Advanced image augmentation
# =============================================================================

  # cutout
  # ------
  # Randomly mask a square region of the image during training (replaces it
  # with zeros or the dataset mean). Acts as strong spatial regularizer.
  #   0.0      : disabled (default)
  #   0.1-0.4  : mask size as fraction of image_size; 0.25 is a good start
  cutout:
    enabled: true
    initial_value: 0.0
    range: [0.0, 0.4]

  # cutmix
  # ------
  # Cuts a square patch from one image and pastes it onto another, mixing
  # the labels proportionally to patch areas. Stronger than mixup for some tasks.
  #   0.0      : disabled (default)
  #   0.5-1.0  : alpha for the Beta distribution that picks patch size; 1.0 typical
  # Note: cutmix and mixup can be enabled together; system picks one per batch.
  cutmix:
    enabled: true
    initial_value: 0.0
    range: [0.0, 1.0]
